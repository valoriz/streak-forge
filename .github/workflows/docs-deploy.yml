name: docs site deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # checks out the branch picked in "Use workflow from"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs site
        working-directory: apps/docs-site
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs-site/dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: docs-deploy  # scopes the Cloudflare secrets; add a required reviewer here if you want an approval gate
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main => always the production deployment, regardless of
          # which branch was built. Change "streak-docs" to your Pages project name.
          command: pages deploy dist --project-name=streak-docs --branch=main
