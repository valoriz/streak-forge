name: npm beta release

run-name: npm beta release from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: write  # tag the release commit, create the GitHub Release
  id-token: write  # npm OIDC / Trusted Publishing provenance

concurrency:
  group: npm-beta-release
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4  # checks out the branch picked in "Use workflow from"

      - name: Resolve beta version from package.json
        id: ver
        working-directory: packages/streak-forge
        run: |
          current="$(node -p "require('./package.json').version")"
          case "$current" in
            *-beta.*|*-beta) version="$current" ;;                       # already a beta prerelease
            *-*) echo "::error::version '$current' has a non-beta prerelease tag - fix packages/streak-forge/package.json"; exit 1 ;;
            *) version="${current}-beta.0" ;;                            # plain version -> first beta
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Beta release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| package.json version | \`$current\` |"
            echo "| Publishing as | \`streak-forge@$version\` |"
            echo "| npm dist-tag | \`beta\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Beta version::Publishing streak-forge@$version from branch ${{ github.ref_name }}"

      - name: Guard - version not already on npm
        run: |
          if npm view "streak-forge@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::streak-forge@${{ steps.ver.outputs.version }} is already published - bump the version in packages/streak-forge/package.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit -p packages/streak-forge/tsconfig.json

      - name: Lint
        working-directory: packages/streak-forge
        run: bun run lint

      - name: Build
        working-directory: packages/streak-forge
        run: bun run build

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: npm-publish  # <- the required-reviewer gate lives here
    env:
      VERSION: ${{ needs.build-and-verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update npm CLI
        # Trusted Publishing needs a recent npm CLI (11.5.1+) - the version
        # bundled with the runner's preinstalled Node is usually older.
        run: npm install -g npm@latest

      - name: Set version
        working-directory: packages/streak-forge
        run: npm pkg set version="$VERSION"

      - name: Build
        working-directory: packages/streak-forge
        run: bun run build

      - name: Publish to npm (beta tag)
        working-directory: packages/streak-forge
        run: npm publish --tag beta --provenance --access public

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "streak-forge@$VERSION"
          git push origin "streak-forge@$VERSION"

      - name: Assemble release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="streak-forge@$VERSION"

          # Previous streak-forge tag (for the "what changed since" diff).
          PREV_TAG="$(git tag -l 'streak-forge@*' --sort=-version:refname \
            | grep -vxF "$TAG" | head -n1 || true)"

          # GitHub's auto notes: PRs since PREV_TAG, grouped by the sections in
          # .github/release.yml, plus contributors and a Full Changelog link.
          AUTO="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} \
            --jq .body)"

          # Optional curated intro, per minor line: RELEASE-<major>.<minor>.md
          # (4.1.7-beta.0 -> RELEASE-4.1.md). Prepended above the auto notes.
          minor="$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+')"
          INTRO=""
          for f in "RELEASE-${minor}.md" "RELEASE_NOTES.md"; do
            if [ -f "$f" ]; then INTRO="$f"; break; fi
          done

          {
            if [ -n "$INTRO" ]; then cat "$INTRO"; printf '\n\n---\n\n'; fi
            echo "$AUTO"
          } > RELEASE_BODY.md

          echo "Assembled notes (prev tag: ${PREV_TAG:-none}):"
          echo "----------------------------------------"
          cat RELEASE_BODY.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "streak-forge@$VERSION" \
            --title "streak-forge v$VERSION" \
            --notes-file RELEASE_BODY.md \
            --prerelease \
            --draft
