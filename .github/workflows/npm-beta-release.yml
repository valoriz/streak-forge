name: npm beta release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and publish from"
        required: true
        type: string
        default: main
      version:
        description: "Version to publish, e.g. 4.0.0-beta.1"
        required: true
        type: string

permissions:
  contents: write  # tag the release commit, create the GitHub Release
  id-token: write  # npm OIDC / Trusted Publishing provenance

concurrency:
  group: npm-beta-release
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce allowed release branches
        # The npm-publish environment's "Deployment branches" rule can't gate
        # this - the workflow always runs from the default branch (the branch
        # to build is an input, not the run's ref), so that rule always sees
        # the default branch and always passes. This step is the real branch
        # gate. Widen the allowlist if you cut releases from release/* too.
        run: |
          case "${{ inputs.branch }}" in
            main) echo "branch ok: ${{ inputs.branch }}" ;;
            *) echo "::error::'${{ inputs.branch }}' is not an allowed release branch"; exit 1 ;;
          esac

      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit -p packages/streak-forge/tsconfig.json

      - name: Lint
        run: bun run lint

      - name: Build
        working-directory: packages/streak-forge
        run: bun run build

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: npm-publish  # <- the required-reviewer gate lives here
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update npm CLI
        # Trusted Publishing needs a recent npm CLI (11.5.1+) - the version
        # bundled with the runner's preinstalled Node is usually older.
        run: npm install -g npm@latest

      - name: Set version
        working-directory: packages/streak-forge
        run: npm pkg set version="${{ inputs.version }}"

      - name: Build
        working-directory: packages/streak-forge
        run: bun run build

      - name: Publish to npm (beta tag)
        working-directory: packages/streak-forge
        run: npm publish --tag beta --provenance --access public

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "streak-forge@${{ inputs.version }}"
          git push origin "streak-forge@${{ inputs.version }}"

      - name: Resolve release-notes file
        id: notes
        run: |
          # Notes live per minor line: RELEASE-<major>.<minor>.md
          # (e.g. 4.1.6-beta.0 -> RELEASE-4.1.md). Fall back to a generic
          # name, then to no notes file at all.
          minor="$(echo "${{ inputs.version }}" | grep -oE '^[0-9]+\.[0-9]+')"
          for f in "RELEASE-${minor}.md" "RELEASE_NOTES.md"; do
            if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; break; fi
          done

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          gh release create "streak-forge@${{ inputs.version }}" \
            --title "streak-forge v${{ inputs.version }}" \
            ${NOTES_FILE:+--notes-file "$NOTES_FILE"} \
            --prerelease \
            --draft