name: npm promote to latest

on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: "Beta git tag to promote, e.g. streak-forge@4.1.0-beta.3"
        required: true
        type: string
      stable_version:
        description: "Stable version to publish, e.g. 4.1.0"
        required: true
        type: string

permissions:
  contents: write  # tag the stable release, create the GitHub Release
  id-token: write  # npm OIDC / Trusted Publishing provenance

concurrency:
  group: npm-beta-release  # same lane as the beta workflow - never publish two at once
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          beta='${{ inputs.beta_tag }}'; beta="${beta#streak-forge@}"
          expected="${beta%%-beta.*}"
          if [ "$beta" = "$expected" ]; then
            echo "::error::'${{ inputs.beta_tag }}' is not a -beta.N tag"; exit 1
          fi
          if [ '${{ inputs.stable_version }}' != "$expected" ]; then
            echo "::error::stable_version '${{ inputs.stable_version }}' != '$expected' (from $beta)"; exit 1
          fi
          case '${{ inputs.stable_version }}' in
            *-*) echo "::error::stable_version must not be a prerelease"; exit 1 ;;
          esac

      - name: Check out the beta tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.beta_tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit -p packages/streak-forge/tsconfig.json

      - name: Lint
        run: bun run lint

      - name: Build
        working-directory: packages/streak-forge
        run: bun run build

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: npm-publish  # reuses the same required-reviewer gate
    steps:
      - name: Check out the beta tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.beta_tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Guard - stable version must not already exist on npm
        run: |
          if npm view "streak-forge@${{ inputs.stable_version }}" version >/dev/null 2>&1; then
            echo "::error::streak-forge@${{ inputs.stable_version }} is already published"; exit 1
          fi

      - name: Set stable version
        working-directory: packages/streak-forge
        run: npm pkg set version="${{ inputs.stable_version }}"

      - name: Build
        working-directory: packages/streak-forge
        run: bun run build

      - name: Publish to npm (latest tag)
        working-directory: packages/streak-forge
        run: npm publish --provenance --access public  # no --tag => latest

      - name: Tag the stable release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "streak-forge@${{ inputs.stable_version }}"
          git push origin "streak-forge@${{ inputs.stable_version }}"

      - name: Resolve release-notes file
        id: notes
        run: |
          minor="$(echo "${{ inputs.stable_version }}" | grep -oE '^[0-9]+\.[0-9]+')"
          for f in "RELEASE-${minor}.md" "RELEASE_NOTES.md"; do
            if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; break; fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          gh release create "streak-forge@${{ inputs.stable_version }}" \
            --title "streak-forge v${{ inputs.stable_version }}" \
            ${NOTES_FILE:+--notes-file "$NOTES_FILE"} \
            --latest